services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/warden.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - bot_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  bot_data:
  redis_data:
