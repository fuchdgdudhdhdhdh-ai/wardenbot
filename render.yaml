services:
  - type: web
    name: warden-team-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: warden-team-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_MODE
        value: webhook
      - key: DATABASE_PATH
        value: /var/data/warden.db
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: LOG_LEVEL
        value: INFO
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: TEAM_CHAT_ID
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SUPERADMIN_ID
        sync: false
      - key: TEAM_INVITE
        sync: false
